phases:
  - id: spec
  - command: /spec
  - produces:
    - artefact: artefacts/SEC-SPEC.md
  
  - id: design
  - command: /design
  - produces:
    - artefact: artefacts/decomposition-results.json
    - artefact: artefacts/threat-model.json
    - artefact: artefacts/architecture-improvements.md
  
  - id: implement
  - command: /implement
  - requires:
    - artefact: artefacts/spec.md
  - produces:
    - artefact: artefacts/implement.md
  
  - id: test
  - command: /test
  - requires:
    - artefact: artefacts/spec.md
  - produces:
    - artefact: artefacts/test.md

  - id: maintain
  - command: /maintain
  - requires:
    - artefact: artefacts/spec.md
  - produces:
    - artefact: artefacts/maintain.md

  - id: deploy
  - command: /deploy
  - requires:
    - artefact: artefacts/spec.md
  - produces:
    - artefact: artefacts/deploy.md